<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WCA Capture — Editor</title>
  <link rel="icon" href="icons/icon48.png">
  <style>
    body { margin: 0; font: 14px system-ui, sans-serif; background: #eef2f7; color: #1c2733; }
    header {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 8px 14px; background: linear-gradient(160deg, #0c4a8a, #0288d1); color: #fff;
      position: sticky; top: 0; z-index: 10;
    }
    header h1 { font-size: 15px; margin: 0 6px 0 0; white-space: nowrap; }
    .tools { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .tools button, .actions button {
      padding: 7px 10px; border: none; border-radius: 8px; font: inherit; font-weight: 600;
      cursor: pointer; background: rgba(255,255,255,.15); color: #fff; white-space: nowrap;
    }
    .tools button:hover { background: rgba(255,255,255,.3); }
    .tools button.active { background: #fff; color: #0c4a8a; }
    .tools .sep { width: 1px; height: 24px; background: rgba(255,255,255,.35); margin: 0 3px; }
    .tools input[type="color"] { width: 34px; height: 30px; border: none; border-radius: 6px; padding: 0; cursor: pointer; }
    .tools input[type="range"] { width: 70px; }
    #text-input {
      padding: 6px 8px; border: none; border-radius: 6px; font: inherit; width: 130px; display: none;
    }
    .actions { margin-left: auto; display: flex; gap: 6px; }
    .actions .primary { background: #ffc107; color: #1c2733; }
    #stage { display: flex; justify-content: center; padding: 24px; }
    canvas {
      max-width: 95vw; height: auto; background: #fff; cursor: crosshair;
      box-shadow: 0 4px 24px rgba(12, 74, 138, .18); border-radius: 4px;
    }
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #0c4a8a; color: #fff; padding: 10px 18px; border-radius: 8px;
      opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>🚢 WCA Capture</h1>
    <div class="tools">
      <button data-tool="pen" class="active" title="Free-hand drawing">✏️ Pen</button>
      <button data-tool="marker" title="Semi-transparent highlighter">🖍️ Marker</button>
      <button data-tool="line" title="Straight line">╱ Line</button>
      <button data-tool="arrow" title="Arrow">➜ Arrow</button>
      <button data-tool="rect" title="Rectangle">▭ Box</button>
      <button data-tool="ellipse" title="Circle / ellipse">◯ Circle</button>
      <button data-tool="text" title="Place text">T Text</button>
      <button data-tool="blur" title="Pixelate an area (hide private info)">▒ Blur</button>
      <input id="text-input" type="text" placeholder="Type, then click image">
      <span class="sep"></span>
      <input id="color" type="color" value="#e53935" title="Color">
      <input id="size" type="range" min="2" max="16" value="4" title="Thickness">
      <span class="sep"></span>
      <button id="undo" title="Undo">↩ Undo</button>
      <button id="redo" title="Redo">↪ Redo</button>
    </div>
    <div class="actions">
      <button id="copy">📋 Copy</button>
      <button id="download" class="primary">⬇ Download PNG</button>
    </div>
  </header>
  <div id="stage"><canvas id="canvas"></canvas></div>
  <div id="toast"></div>
  <script src="editor.js"></script>
</body>
</html>
