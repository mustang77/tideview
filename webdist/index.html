<!DOCTYPE html>
<html>
<head>
  <!--

    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="H2O Laundry Parakan - lacak status cucian Anda.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="H2O Laundry">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>H2O Laundry Parakan</title>
  <link rel="manifest" href="manifest.json">

  <!-- Simpan event install PWA supaya bisa dipicu dari menu aplikasi
       (banner "Instal aplikasi" Chrome sering tidak muncul sendiri). -->
  <script>
    let _h2oInstallEvent = null;
    let _h2oWantInstall = false;
    let _h2oPrompted = false;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      _h2oInstallEvent = e;
      // Pengguna tadi mengetuk Install sebelum event siap? Langsung.
      if (_h2oWantInstall) {
        _h2oWantInstall = false;
        _h2oInstallEvent = null;
        _h2oPrompted = true;
        e.prompt();
      }
    });
    window.h2oDidPrompt = () => _h2oPrompted;
    window.h2oCanInstall = () => !!_h2oInstallEvent;
    window.h2oIsStandalone = () =>
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
    window.h2oInstall = () => {
      if (!_h2oInstallEvent) {
        _h2oWantInstall = true; // antre: prompt begitu event datang
        return false;
      }
      _h2oPrompted = true;
      _h2oInstallEvent.prompt();
      _h2oInstallEvent = null;
      return true;
    };
    // true bila PWA ini sudah terpasang di perangkat (Chrome Android).
    window.h2oIsInstalled = async () => {
      try {
        if (navigator.getInstalledRelatedApps) {
          const apps = await navigator.getInstalledRelatedApps();
          return apps.length > 0;
        }
      } catch (e) {}
      return false;
    };

    // ---- Web Bluetooth: cetak struk ke printer thermal BLE ----
    // Hanya BLE (batasan browser); printer SPP-saja tidak akan muncul
    // di pemilihnya. Layanan/karakteristik umum printer thermal murah.
    let _btDev = null;
    let _btChar = null;
    const _BT_SERVICES = [0x18f0, 0xffe0, 0xff00,
      'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
      '49535343-fe7d-4ae5-8fa9-9fafd205e455'];
    window.h2oBtSupported = () => !!navigator.bluetooth;
    window.h2oBtReady = () =>
        !!(_btDev && _btDev.gatt.connected && _btChar);
    async function _h2oBtConnect() {
      if (!_btDev) return false;
      try {
        const gatt = await _btDev.gatt.connect();
        // Hanya layanan printer yang dikenal — perangkat BLE lain
        // (earbuds/TV) tidak akan dianggap "tersambung".
        for (const u of _BT_SERVICES) {
          try {
            const s = await gatt.getPrimaryService(u);
            for (const c of await s.getCharacteristics()) {
              if (c.properties.writeWithoutResponse ||
                  c.properties.write) {
                _btChar = c;
                return true;
              }
            }
          } catch (e) {}
        }
      } catch (e) {}
      _btChar = null;
      return false;
    }
    // Harus dipanggil dari ketukan pengguna. Balik nama printer / ''.
    window.h2oBtPick = async () => {
      try {
        const dev = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: _BT_SERVICES,
        });
        _btDev = dev;
        _btChar = null;
        return (await _h2oBtConnect()) ? (dev.name || 'Printer BLE') : '';
      } catch (e) {
        return '';
      }
    };
    // Kirim byte ESC/POS (base64), dicicil kecil-kecil khas BLE.
    window.h2oBtPrint = async (b64) => {
      try {
        if (!window.h2oBtReady() && !(await _h2oBtConnect())) return false;
        const bin = atob(b64);
        const data = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) data[i] = bin.charCodeAt(i);
        const chunk = 120;
        for (let i = 0; i < data.length; i += chunk) {
          const slice = data.slice(i, i + chunk);
          if (_btChar.properties.writeWithoutResponse) {
            await _btChar.writeValueWithoutResponse(slice);
          } else {
            await _btChar.writeValueWithResponse(slice);
          }
          await new Promise((r) => setTimeout(r, 25));
        }
        return true;
      } catch (e) {
        return false;
      }
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
