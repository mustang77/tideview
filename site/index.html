<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E6E4F">
<meta name="description" content="Paramall — belanja Alfamart & Indomaret, kami yang antar ke rumah.">
<title>Paramall</title>
<style>
  :root {
    --ground:#FBF9F4; --surface:#FFFFFF; --surface-2:#F3F0E8;
    --ink:#16211C; --muted:#657069; --line:#E8E2D6;
    --primary:#1E6E4F; --primary-ink:#134A34; --primary-soft:#E4F0E9;
    --accent:#E4952A; --accent-soft:#FBEAD1; --accent-ink:#8A5410;
    --shadow:0 1px 2px rgba(20,40,30,.06), 0 8px 24px rgba(20,40,30,.06);
    --tile-a:#EAF2EC; --tile-b:#FBEEDB; --tile-c:#EAF0F6; --tile-d:#F6EBF1; --tile-e:#F0EFE6;
    --font-display: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Segoe UI", system-ui, sans-serif;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#0E1411; --surface:#161D19; --surface-2:#1E2620;
      --ink:#ECF2EE; --muted:#95A29A; --line:#26302A;
      --primary:#54BD8E; --primary-ink:#BEE9D5; --primary-soft:#17352A;
      --accent:#F2AA4C; --accent-soft:#38290F; --accent-ink:#F2C489;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
      --tile-a:#18271F; --tile-b:#2A2213; --tile-c:#182230; --tile-d:#271A22; --tile-e:#22261C;
    }
  }
  :root[data-theme="dark"] {
    --ground:#0E1411; --surface:#161D19; --surface-2:#1E2620;
    --ink:#ECF2EE; --muted:#95A29A; --line:#26302A;
    --primary:#54BD8E; --primary-ink:#BEE9D5; --primary-soft:#17352A;
    --accent:#F2AA4C; --accent-soft:#38290F; --accent-ink:#F2C489;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
    --tile-a:#18271F; --tile-b:#2A2213; --tile-c:#182230; --tile-d:#271A22; --tile-e:#22261C;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { background:var(--ground); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased; line-height:1.45; }
  .app { max-width:480px; margin:0 auto; min-height:100vh; background:var(--ground); position:relative; display:flex; flex-direction:column; box-shadow:0 0 60px rgba(0,0,0,.06); }

  .top { position:sticky; top:0; z-index:20; background:var(--primary); color:#fff; padding:14px 16px 12px; border-radius:0 0 20px 20px; }
  .brandline { display:flex; align-items:center; gap:10px; }
  .logo { width:34px; height:34px; border-radius:10px; background:#fff; color:var(--primary); display:grid; place-items:center; font-size:20px; flex:none; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  .brand { font-family:var(--font-display); font-weight:800; font-size:22px; letter-spacing:-.01em; }
  .brand small { display:block; font-family:var(--font-body); font-weight:500; font-size:11.5px; opacity:.9; margin-top:1px; }
  .preview-chip { margin-left:auto; align-self:flex-start; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; background:rgba(255,255,255,.18); color:#fff; padding:4px 8px; border-radius:999px; border:1px solid rgba(255,255,255,.3); }
  .loc { display:inline-flex; align-items:center; gap:6px; margin-top:11px; font-size:12.5px; color:#fff; background:rgba(255,255,255,.14); padding:5px 10px; border-radius:999px; }
  .loc b { font-weight:700; }
  .search { margin-top:11px; display:flex; align-items:center; gap:9px; background:#fff; border-radius:13px; padding:11px 13px; }
  .search svg { width:17px; height:17px; color:var(--muted); flex:none; }
  .search input { border:0; outline:0; width:100%; font-size:14.5px; font-family:var(--font-body); background:transparent; color:var(--ink); }

  .cats { display:flex; gap:8px; overflow-x:auto; padding:14px 16px 4px; scrollbar-width:none; }
  .cats::-webkit-scrollbar { display:none; }
  .cat { flex:none; font-size:13px; font-weight:600; white-space:nowrap; padding:8px 14px; border-radius:999px; cursor:pointer; background:var(--surface-2); color:var(--ink); border:1px solid transparent; transition:transform .08s ease; }
  .cat:active { transform:scale(.96); }
  .cat[aria-pressed="true"] { background:var(--primary); color:#fff; }

  .promo { margin:12px 16px 4px; padding:14px 16px; background:linear-gradient(100deg,var(--accent-soft),var(--surface)); border:1px solid var(--line); border-radius:16px; display:flex; align-items:center; gap:12px; }
  .promo .emoji { font-size:26px; }
  .promo p { margin:0; font-size:12.5px; color:var(--muted); }
  .promo b { color:var(--ink); font-family:var(--font-display); font-size:14px; display:block; margin-bottom:1px; }

  .sectionhdr { display:flex; align-items:baseline; justify-content:space-between; padding:16px 16px 8px; }
  .sectionhdr h2 { margin:0; font-family:var(--font-display); font-size:16.5px; font-weight:800; letter-spacing:-.01em; }
  .sectionhdr span { font-size:12px; color:var(--muted); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 16px 140px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:9px; display:flex; flex-direction:column; box-shadow:var(--shadow); }
  .thumb { position:relative; aspect-ratio:1/1; border-radius:12px; display:grid; place-items:center; font-size:44px; margin-bottom:9px; overflow:hidden; background:var(--surface-2); }
  .thumb img { width:100%; height:100%; object-fit:contain; mix-blend-mode:multiply; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .thumb img { mix-blend-mode:normal; } }
  :root[data-theme="dark"] .thumb img { mix-blend-mode:normal; }
  .tag { position:absolute; top:7px; left:7px; background:var(--accent); color:#3a2400; font-size:10px; font-weight:800; padding:3px 7px; border-radius:999px; z-index:2; }
  .name { font-size:13.2px; font-weight:600; line-height:1.3; margin:0 2px; min-height:34px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .size { font-size:11.5px; color:var(--muted); margin:2px 2px 8px; }
  .pricerow { margin-top:auto; display:flex; align-items:flex-end; justify-content:space-between; gap:6px; padding:0 2px 2px; }
  .price { font-family:var(--font-display); font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; }
  .old { font-size:11px; color:var(--muted); text-decoration:line-through; display:block; font-variant-numeric:tabular-nums; margin-bottom:1px; }
  .add { flex:none; width:34px; height:34px; border-radius:11px; cursor:pointer; background:var(--primary-soft); color:var(--primary-ink); border:0; font-size:20px; font-weight:700; line-height:1; display:grid; place-items:center; transition:transform .08s ease; }
  .add:active { transform:scale(.9); }
  .stepper { display:none; align-items:center; gap:8px; }
  .stepper.on { display:flex; }
  .add.hide { display:none; }
  .stepper button { width:28px; height:28px; border-radius:9px; border:0; cursor:pointer; background:var(--primary); color:#fff; font-size:17px; line-height:1; display:grid; place-items:center; }
  .stepper b { font-size:14px; min-width:16px; text-align:center; font-variant-numeric:tabular-nums; }

  .cartbar { position:sticky; bottom:0; z-index:20; margin:0 auto; width:100%; max-width:480px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:linear-gradient(to top,var(--ground) 72%, transparent); }
  .cartinner { background:var(--primary); color:#fff; border-radius:16px; padding:13px 16px; display:flex; align-items:center; gap:12px; box-shadow:0 8px 24px rgba(20,80,55,.28); opacity:.55; filter:saturate(.7); transition:opacity .2s ease, filter .2s ease; }
  .cartinner.active { opacity:1; filter:none; }
  .cartinfo { display:flex; flex-direction:column; line-height:1.2; }
  .cartinfo small { font-size:11.5px; opacity:.85; }
  .cartinfo b { font-family:var(--font-display); font-size:17px; font-variant-numeric:tabular-nums; }
  .checkout { margin-left:auto; background:#fff; color:var(--primary-ink); border:0; border-radius:11px; padding:10px 16px; cursor:pointer; font-family:var(--font-display); font-weight:800; font-size:14px; display:inline-flex; align-items:center; gap:7px; transition:transform .08s ease; }
  .checkout:active { transform:scale(.96); }

  .foot { text-align:center; font-size:11px; color:var(--muted); padding:0 24px 20px; }
  .empty { text-align:center; color:var(--muted); font-size:13.5px; padding:40px 24px; grid-column:1/-1; }

  .toast { position:fixed; left:50%; bottom:96px; transform:translate(-50%,20px); background:var(--ink); color:var(--ground); padding:11px 16px; border-radius:12px; font-size:13px; max-width:320px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.3); opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease; z-index:50; }
  .toast.show { opacity:1; transform:translate(-50%,0); }
  button:focus-visible, input:focus-visible, .cat:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>

</div>

<div class="toast" id="toast"></div>

  let P = [];
  let activeCat = "Semua";
  const cart = {};

  const catsEl = document.getElementById("cats");
  const grid = document.getElementById("grid");
  const q = document.getElementById("q");
  q.addEventListener("input", render);

  function buildCats() {
    const present = new Set(P.map(x => x.cat));
    const cats = CAT_ORDER.filter(c => c === "Semua" || present.has(c));
    catsEl.innerHTML = "";
    cats.forEach(c => {
      const b = document.createElement("button");
      b.className = "cat"; b.textContent = c;
      b.setAttribute("aria-pressed", c === activeCat);
      b.onclick = () => { activeCat = c; [...catsEl.children].forEach(x => x.setAttribute("aria-pressed", x.textContent === c)); render(); };
      catsEl.appendChild(b);
    });
  }

  function render() {
    const term = q.value.trim().toLowerCase();
    document.getElementById("secttl").textContent = activeCat === "Semua" ? "Semua produk" : activeCat;
    const list = [];
    P.forEach((x, i) => {
      if ((activeCat === "Semua" || x.cat === activeCat) && (!term || x.name.toLowerCase().includes(term))) list.push(i);
    });
    document.getElementById("count").textContent = list.length + " item";
    grid.innerHTML = "";
    if (!list.length) { grid.innerHTML = '<div class="empty">Tidak ada produk yang cocok.</div>'; return; }
    list.forEach(i => grid.appendChild(cardFor(P[i], i)));
  }

  function cardFor(x, i) {
    const qty = cart[i] || 0;
    const el = document.createElement("article");
    el.className = "card";
    const emoji = EMOJI[x.cat] || "🛍️";
    const thumb = x.imageUrl
      ? `<img src="${x.imageUrl}" alt="" loading="lazy" onerror="this.remove();this.parentNode.append('${emoji}')">`
      : emoji;
    const disc = x.priceOriginal && x.priceOriginal > x.price;
    el.innerHTML = `
      <div class="thumb ${TILES[i % TILES.length]}">${disc ? '<span class="tag">Hemat</span>':""}${thumb}</div>
      <p class="name">${x.name}</p>
      <div class="pricerow">
        <div>${disc ? `<span class="old">${rp(x.priceOriginal)}</span>`:""}<span class="price">${rp(x.price)}</span></div>
        <button class="add ${qty?"hide":""}" aria-label="Tambah">+</button>
        <div class="stepper ${qty?"on":""}"><button class="minus" aria-label="Kurangi">−</button><b>${qty}</b><button class="plus" aria-label="Tambah">+</button></div>
      </div>`;
    el.querySelector(".add").onclick = () => chg(i, 1);
    el.querySelector(".plus")?.addEventListener("click", () => chg(i, 1));
    el.querySelector(".minus")?.addEventListener("click", () => chg(i, -1));
    return el;
  }

  function chg(i, d) { cart[i] = Math.max(0, (cart[i]||0)+d); if (!cart[i]) delete cart[i]; render(); updateCart(); }
  function updateCart() {
    const items = Object.values(cart).reduce((a,q)=>a+q,0);
    const total = Object.entries(cart).reduce((a,[i,q])=>a+(P[i].price||0)*q,0);
    document.getElementById("cartcount").textContent = items ? `${items} barang di keranjang` : "Keranjang kosong";
    document.getElementById("carttotal").textContent = rp(total);
    document.getElementById("cartinner").classList.toggle("active", items>0);
  }

  const toast = document.getElementById("toast"); let tmr;
  function say(m){ toast.textContent=m; toast.classList.add("show"); clearTimeout(tmr); tmr=setTimeout(()=>toast.classList.remove("show"),2600); }
  document.getElementById("checkout").onclick = () => {
    const items = Object.values(cart).reduce((a,q)=>a+q,0);
    say(items ? "Pesanan diterima (preview) — checkout & pembayaran menyusul 🚧" : "Keranjang masih kosong 🙂");
  };

  function load(data, live) {
    P = data.map(x => ({
      name: x.name, price: x.price, priceOriginal: x.priceOriginal,
      imageUrl: x.imageUrl || "", cat: catOf(x.name || "")
    })).filter(x => x.name && x.price);
    buildCats(); render(); updateCart();
    const chip = document.getElementById("srcchip");
    const foot = document.getElementById("foot");
    if (live) {
      chip.textContent = "Live"; chip.style.background = "rgba(255,255,255,.28)";
      foot.textContent = `${P.length} produk dari Alfamart. Harga indikatif — dicek ulang saat tim belanja.`;
    } else {
      foot.textContent = "Contoh produk (catalog.json belum ada). Upload catalog.json untuk data asli.";
    }
  }

  // Minimal fallback if EMBEDDED is somehow empty.
  const SAMPLE = [
    {name:"Indomie Mi Instan Ayam Bawang 69 g", price:3200, imageUrl:""},
    {name:"Ultra Milk Susu UHT Coklat 250 ml", price:8400, imageUrl:""},
  ];

  // Show embedded real products immediately...
  const start = (Array.isArray(EMBEDDED) && EMBEDDED.length) ? EMBEDDED : SAMPLE;
  load(start, Array.isArray(EMBEDDED) && EMBEDDED.length > 0);
  // ...then override with catalog.json if one is uploaded alongside this file.
  fetch("catalog.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null)
    .then(d => { if (Array.isArray(d) && d.length) load(d, true); })
    .catch(() => {});
</script>
