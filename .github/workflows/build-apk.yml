name: Build APK

on:
  push:
    branches:
      - claude/al-quran-app-3jqqsx
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: al-quran-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: al-quran-latest
          name: Al-Quran APK (latest)
          prerelease: true
          body: |
            Latest build of the Al-Quran app.
            Download **app-release.apk** below and install it on your Android phone.
          files: build/app/outputs/flutter-apk/app-release.apk
