name: Scrape catalog

# Runs the Alfagift / Klik Indomaret scraper on a GitHub-hosted machine so you
# don't need to install anything on your own PC. Trigger it from the GitHub
# website: Actions tab -> "Scrape catalog" -> "Run workflow". When it finishes,
# download the "catalog-*" artifact (a zip with catalog.csv + catalog.json).

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Which store to scrape"
        type: choice
        default: alfagift
        options:
          - alfagift
          - klikindomaret
      mode:
        description: "How to scrape"
        type: choice
        default: search
        options:
          - search      # query = comma-separated keywords, e.g. "indomie,beras,gula"
          - category    # query = a single category id (get ids from list-categories)
          - all         # walk every category (ignores query)
          - list-categories  # just print category ids, no catalog file
      query:
        description: "Keywords (search) or category id (category). Ignored for all/list-categories."
        type: string
        default: "indomie,beras,minyak goreng,gula,telur,kopi,teh,susu,sabun,shampoo"
      max:
        description: "Max number of products"
        type: string
        default: "300"
      store_code:
        description: "(Indomaret) store code — set to your city's store"
        type: string
        default: "TJKT"
      lat:
        description: "(Indomaret) latitude"
        type: string
        default: "-6.1763897"
      lng:
        description: "(Indomaret) longitude"
        type: string
        default: "106.82667"
      district:
        description: "(Indomaret) district id"
        type: string
        default: "141100100"
  # TEMPORARY: auto-run on pushes to the dev branch so the workflow can be
  # verified before it reaches the default branch. Remove this block once merged.
  push:
    branches:
      - claude/alfamart-indomaret-api-acpx8f
    paths:
      - ".github/workflows/scrape-catalog.yml"
      - "tools/**"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fallbacks make the job work both for manual runs (inputs set) and the
    # temporary push trigger (inputs empty -> small, fast defaults).
    env:
      SOURCE: ${{ inputs.source || 'alfagift' }}
      MODE: ${{ inputs.mode || 'search' }}
      QUERY: ${{ inputs.query || 'indomie,mie sedaap,beras,minyak goreng,gula,telur,kopi,teh,susu,air mineral,kecap,saus sambal,tepung,roti,biskuit,snack,sabun mandi,shampoo,pasta gigi,tisu,detergen,pewangi,popok,sabun cuci piring' }}
      MAX: ${{ inputs.max || '250' }}
      STORE_CODE: ${{ inputs.store_code || 'TJKT' }}
      LAT: ${{ inputs.lat || '-6.1763897' }}
      LNG: ${{ inputs.lng || '106.82667' }}
      DISTRICT: ${{ inputs.district || '141100100' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and scrape
        shell: bash
        run: |
          set -e
          if [ "$SOURCE" = "klikindomaret" ]; then
            DIR=tools/klikindomaret_scraper
          else
            DIR=tools/alfagift_scraper
          fi
          echo "Scraping $SOURCE (mode=$MODE, max=$MAX) in $DIR"
          cd "$DIR"

          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install
          npx playwright install --with-deps chromium

          LOC=()
          if [ "$SOURCE" = "klikindomaret" ]; then
            LOC=(--store-code "$STORE_CODE" --lat "$LAT" --lng "$LNG" --district "$DISTRICT")
          fi

          case "$MODE" in
            search)          node scrape.js --search "$QUERY" --max "$MAX" "${LOC[@]}" ;;
            category)        node scrape.js --category "$QUERY" --max "$MAX" "${LOC[@]}" ;;
            all)             node scrape.js --all --max "$MAX" "${LOC[@]}" ;;
            list-categories) node scrape.js --list-categories "${LOC[@]}" ;;
          esac

      - name: Upload catalog
        if: ${{ (inputs.mode || 'search') != 'list-categories' }}
        uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ inputs.source || 'alfagift' }}
          path: tools/*_scraper/output/*
          if-no-files-found: warn
