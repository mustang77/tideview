name: Scrape catalog

# Runs the Alfagift / Klik Indomaret scraper on a GitHub-hosted machine so you
# don't need to install anything on your own PC. Trigger it from the GitHub
# website: Actions tab -> "Scrape catalog" -> "Run workflow". When it finishes,
# download the "catalog-*" artifact (a zip with catalog.csv + catalog.json).

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Which store to scrape"
        type: choice
        default: alfagift
        options:
          - alfagift
          - klikindomaret
      mode:
        description: "How to scrape"
        type: choice
        default: search
        options:
          - search      # query = comma-separated keywords, e.g. "indomie,beras,gula"
          - category    # query = a single category id (get ids from list-categories)
          - all         # walk every category (ignores query)
          - list-categories  # just print category ids, no catalog file
      query:
        description: "Keywords (search) or category id (category). Ignored for all/list-categories."
        type: string
        default: "indomie,beras,minyak goreng,gula,telur,kopi,teh,susu,sabun,shampoo"
      max:
        description: "Max number of products"
        type: string
        default: "300"
      store_code:
        description: "(Indomaret) store code — set to your city's store"
        type: string
        default: "TJKT"
      lat:
        description: "(Indomaret) latitude"
        type: string
        default: "-6.1763897"
      lng:
        description: "(Indomaret) longitude"
        type: string
        default: "106.82667"
      district:
        description: "(Indomaret) district id"
        type: string
        default: "141100100"
  # TEMPORARY: auto-run on pushes to the dev branch so the workflow can be
  # verified before it reaches the default branch. Remove this block once merged.
  push:
    branches:
      - claude/alfamart-indomaret-api-acpx8f
    paths:
      - ".github/workflows/scrape-catalog.yml"
      - "tools/**"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fallbacks make the job work both for manual runs (inputs set) and the
    # temporary push trigger (inputs empty -> small, fast defaults).
    env:
      SOURCE: ${{ inputs.source || 'klikindomaret' }}
      MODE: ${{ inputs.mode || 'all' }}
      QUERY: ${{ inputs.query || 'indomie,mie sedaap,sarimi,pop mie,supermi,lemonilo,beras,minyak goreng,bimoli,sania,sunco,fortune,filma,gula pasir,gulaku,rose brand,telur,tepung terigu,segitiga biru,cakra,kunci biru,maizena,hunkwe,blue band,margarin,simas,santan,kara,garam,masako,royco,sasa,kaldu,kecap bango,kecap abc,saus abc,saus sambal,saos tomat,saus tiram,mentega,keju kraft,kraft,frisian flag,ultra milk,indomilk,bear brand,milo,dancow,susu kental manis,kopi kapal api,good day,nescafe,luwak,abc kopi,teh sariwangi,teh pucuk,teh sosro,frestea,teh gelas,fruit tea,aqua,le minerale,cleo,vit,nestle pure life,pocari sweat,mizone,you c1000,kratingdaeng,extra joss,coca cola,sprite,fanta,floridina,marjan,nutrisari,marimas,pop ice,jasjus,energen,quaker,koko krunch,chitato,lays,taro,qtela,cheetos,chiki,oreo,roma,biskuat,khong guan,tango,nabati,richeese,beng beng,silverqueen,delfi,cadbury,kitkat,permen,mentos,kopiko,relaxa,kacang garuda,dua kelinci,pilus,momogi,pepsodent,ciptadent,close up,formula,lifebuoy,nuvo,dettol,lux,giv,shinzui,sunsilk,clear,pantene,head shoulders,dove,rejoice,emeron,zinc,rexona,nivea,vaseline,citra,marina,gatsby,ponds,wardah,rinso,attack,daia,so klin,molto,downy,sunlight,mama lemon,wipol,super pell,bayclin,vixal,harpic,baygon,hit,vape,stella,kispray,paseo,nice,tessa,tisu,mamypoko,sweety,merries,pampers,popok,charm,laurier,softex,pembalut,sgm,bebelac,nutrilon,lactogen,milna,cerelac,promina,susu bayi,minyak telon,minyak kayu putih,madu,sarden,kornet,sosis,nugget,bakso,tepung bumbu,sasa,ladaku,cabe bubuk,kecap ikan' }}
      MAX: ${{ inputs.max || '1200' }}
      STORE_CODE: ${{ inputs.store_code || 'TJKT' }}
      LAT: ${{ inputs.lat || '-6.1763897' }}
      LNG: ${{ inputs.lng || '106.82667' }}
      DISTRICT: ${{ inputs.district || '141100100' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and scrape
        shell: bash
        run: |
          set -e
          if [ "$SOURCE" = "klikindomaret" ]; then
            DIR=tools/klikindomaret_scraper
          else
            DIR=tools/alfagift_scraper
          fi
          echo "Scraping $SOURCE (mode=$MODE, max=$MAX) in $DIR"
          cd "$DIR"

          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install
          npx playwright install --with-deps chromium

          LOC=()
          if [ "$SOURCE" = "klikindomaret" ]; then
            LOC=(--store-code "$STORE_CODE" --lat "$LAT" --lng "$LNG" --district "$DISTRICT")
          fi

          case "$MODE" in
            search)          node scrape.js --search "$QUERY" --max "$MAX" "${LOC[@]}" ;;
            category)        node scrape.js --category "$QUERY" --max "$MAX" "${LOC[@]}" ;;
            all)             node scrape.js --all --max "$MAX" "${LOC[@]}" ;;
            list-categories) node scrape.js --list-categories "${LOC[@]}" ;;
          esac

      - name: Upload catalog
        if: ${{ (inputs.mode || 'search') != 'list-categories' }}
        uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ inputs.source || 'alfagift' }}
          path: tools/*_scraper/output/*
          if-no-files-found: warn

      # Convert the scrape into the app's catalog shape ({name, price,
      # priceOriginal?, imageUrl}) and commit it, so products get REAL photos.
      # Safety: aborts if the scrape returned too few products (won't wipe the
      # existing catalog on a failed/blocked run).
      - name: Update app catalog (real images)
        if: ${{ (inputs.mode || 'search') != 'list-categories' }}
        shell: bash
        run: |
          set -e
          if [ "$SOURCE" = "klikindomaret" ]; then
            SRC=tools/klikindomaret_scraper/output/catalog.json
          else
            SRC=tools/alfagift_scraper/output/catalog.json
          fi
          if [ ! -f "$SRC" ]; then echo "No scrape output at $SRC — skipping."; exit 0; fi
          SRC="$SRC" node -e '
            const fs=require("fs");
            const src=JSON.parse(fs.readFileSync(process.env.SRC,"utf8"));
            let existing=[]; try{ existing=JSON.parse(fs.readFileSync("assets/catalog.json","utf8")); }catch(e){}
            const int=v=>{const n=Math.round(Number(v)); return Number.isFinite(n)?n:0;};
            const seen=new Set(); const out=[];
            const add=(p)=>{
              if(!p||!p.name) return;
              const price=int(p.price); if(price<=0) return;
              const img=(typeof p.imageUrl==="string")?p.imageUrl:""; if(!img) return;
              const key=String(p.name).trim().toLowerCase(); if(seen.has(key)) return; seen.add(key);
              const row={name:String(p.name).trim(), price};
              const po=int(p.priceOriginal); if(po>price) row.priceOriginal=po;
              row.imageUrl=img; out.push(row);
            };
            existing.forEach(add);
            src.forEach(add);
            if(out.length<60){ console.error("Only "+out.length+" products — aborting."); process.exit(3); }
            const json=JSON.stringify(out,null,1)+"\n";
            fs.writeFileSync("assets/catalog.json",json);
            fs.writeFileSync("site/catalog.json",json);
            console.log("Catalog now has "+out.length+" products (was "+existing.length+").");
          '
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/catalog.json site/catalog.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged."
          else
            git commit -m "Refresh catalog from ${SOURCE} scrape — real product photos"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Pushed updated catalog."
          fi
