name: Build Flutter web

# Builds the Paramall Flutter web app on a GitHub runner (Flutter isn't needed
# locally). Download the "paramall-flutter-web" artifact and upload its contents
# to the site when you're ready to switch from the HTML version.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/alfamart-indomaret-api-acpx8f
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'assets/**'
      - 'web/**'
      - 'analysis_options.yaml'
      - '.github/workflows/build-flutter.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version
      - run: flutter pub get
      # Deployed inside public_html/store/ so the web root stays tidy.
      - run: flutter build web --release --base-href /store/
      # Bundle the image proxy so product photos load on web (canvas CORS).
      # (The app calls /img.php at the site root, which already exists; this
      # copy is just a harmless spare inside the folder.)
      - run: cp site/img.php build/web/img.php
      - uses: actions/upload-artifact@v4
        with:
          name: paramall-flutter-web
          path: build/web/
          if-no-files-found: error
