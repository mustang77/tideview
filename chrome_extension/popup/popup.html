<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>TideView Helper</h1>

  <div id="status">Open a YouTube video to use this.</div>

  <div id="video-info" hidden>
    <div class="label">Current video</div>
    <div id="video-title"></div>
    <code id="video-id"></code>
    <button id="copy-btn">Copy video ID</button>
    <button id="copy-link-btn">Copy watch link</button>
  </div>

  <footer><span id="copy-count">0</span> IDs copied so far</footer>

  <!-- Inline <script> is blocked by extension CSP; scripts must be separate files. -->
  <script src="popup.js"></script>
</body>
</html>
