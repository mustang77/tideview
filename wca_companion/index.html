<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Cruise Academy Companion — Tools & Guidance for Cruise Guests and Crew</title>
  <meta name="description" content="Free bilingual cruise companion for guests and crew: step-by-step guides, packing checklists, cruise countdown, gratuity calculator, maritime glossary and quiz. English & Bahasa Indonesia. By World Cruise Academy.">
  <meta name="keywords" content="cruise guide, cruise crew, cruise tips, cruise packing list, cruise glossary, work on cruise ship, kerja di kapal pesiar, cruise line, world cruise academy">
  <meta property="og:title" content="World Cruise Academy Companion">
  <meta property="og:description" content="Tools & guidance for cruise guests and crew — guides, checklists, calculators, glossary, quiz. EN / ID.">
  <link rel="icon" href="icons/icon48.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="#home" data-nav="home">
    <img src="icons/icon48.png" alt="" width="30" height="30">
    <span>WORLD CRUISE ACADEMY <em>COMPANION</em></span>
  </a>
  <nav id="nav">
    <a href="#guest" data-nav="guest" data-i18n="navGuest"></a>
    <a href="#crew" data-nav="crew" data-i18n="navCrew"></a>
    <a href="#tools" data-nav="tools" data-i18n="navTools"></a>
    <a href="#glossary" data-nav="glossary" data-i18n="navGlossary"></a>
    <a href="#quiz" data-nav="quiz" data-i18n="navQuiz"></a>
    <select id="lang-select" title="Language / Bahasa">
      <option value="en">🌐 English</option>
      <option value="id">🌐 Bahasa Indonesia</option>
    </select>
  </nav>
</header>

<!-- ============ HOME ============ -->
<section id="home" class="view">
  <div class="hero">
    <h1 data-i18n="heroTitle"></h1>
    <p data-i18n-html="heroSub"></p>
    <div class="hero-cards">
      <a class="hero-card" href="#guest" data-nav="guest">
        <span class="big">🧳</span>
        <h2 data-i18n="guestCardTitle"></h2>
        <p data-i18n="guestCardDesc"></p>
      </a>
      <a class="hero-card" href="#crew" data-nav="crew">
        <span class="big">⚓</span>
        <h2 data-i18n="crewCardTitle"></h2>
        <p data-i18n="crewCardDesc"></p>
      </a>
    </div>
    <div class="hero-tools">
      <a href="#tools" data-nav="tools" data-i18n="chipCountdown"></a>
      <a href="#tools" data-nav="tools" data-i18n="chipChecklists"></a>
      <a href="#tools" data-nav="tools" data-i18n="chipTip"></a>
      <a href="#glossary" data-nav="glossary" data-i18n="chipGlossary"></a>
      <a href="#quiz" data-nav="quiz" data-i18n="chipQuiz"></a>
    </div>
  </div>
</section>

<!-- ============ GUEST GUIDE ============ -->
<section id="guest" class="view">
  <h1 data-i18n="guestTitle"></h1>
  <p class="lead" data-i18n="guestLead"></p>
  <div id="guest-guide" class="accordion"></div>
</section>

<!-- ============ CREW GUIDE ============ -->
<section id="crew" class="view">
  <h1 data-i18n="crewTitle"></h1>
  <p class="lead" data-i18n="crewLead"></p>
  <div id="crew-guide" class="accordion"></div>
</section>

<!-- ============ TOOLS ============ -->
<section id="tools" class="view">
  <h1 data-i18n="toolsTitle"></h1>

  <div class="tool-grid">

    <div class="tool card">
      <h2 data-i18n="cdTitle"></h2>
      <div id="cd-setup">
        <label><span data-i18n="cdWhat"></span>
          <input id="cd-name" type="text" data-i18n-ph="cdPlaceholder" maxlength="60">
        </label>
        <label><span data-i18n="cdDate"></span> <input id="cd-date" type="date"></label>
        <button id="cd-save" class="primary" data-i18n="cdStart"></button>
      </div>
      <div id="cd-display" hidden>
        <p id="cd-cruise-name"></p>
        <div id="cd-days">–</div>
        <p id="cd-label"></p>
        <button id="cd-reset" class="ghost" data-i18n="cdChange"></button>
      </div>
    </div>

    <div class="tool card">
      <h2 data-i18n="clTitle"></h2>
      <div class="seg">
        <button class="seg-btn active" data-list="guest" data-i18n="clGuest"></button>
        <button class="seg-btn" data-list="crew" data-i18n="clCrew"></button>
      </div>
      <p class="progress"><span id="cl-done">0</span>/<span id="cl-total">0</span> <span data-i18n="clPacked"></span></p>
      <div id="cl-groups"></div>
    </div>

    <div class="tool card">
      <h2 data-i18n="tipTitle"></h2>
      <label><span data-i18n="tipGuests"></span> <input id="tip-guests" type="number" min="1" value="2"></label>
      <label><span data-i18n="tipNights"></span> <input id="tip-nights" type="number" min="1" value="7"></label>
      <label><span data-i18n="tipRate"></span>
        <input id="tip-rate" type="number" min="0" step="0.5" value="16">
      </label>
      <div class="result"><span data-i18n="tipService"></span> <strong id="tip-total">$224.00</strong></div>
      <label><span data-i18n="tipBarBill"></span> <input id="bar-bill" type="number" min="0" value="0"></label>
      <label><span data-i18n="tipBarPct"></span> <input id="bar-pct" type="number" min="0" max="30" value="18"></label>
      <div class="result"><span data-i18n="tipBar"></span> <strong id="bar-total">$0.00</strong></div>
      <p class="note" data-i18n="tipNote"></p>
    </div>

    <div class="tool card">
      <h2 data-i18n="cvTitle"></h2>
      <label><span data-i18n="cvSpeed"></span>
        <span class="row"><input id="cv-knots" type="number" step="any" data-i18n-ph="cvKnotsPh">
        <output id="cv-speed">= km/h · mph</output></span>
      </label>
      <label><span data-i18n="cvDist"></span>
        <span class="row"><input id="cv-nm" type="number" step="any" data-i18n-ph="cvNmPh">
        <output id="cv-dist">= km · mi</output></span>
      </label>
      <label><span data-i18n="cvDepth"></span>
        <span class="row"><input id="cv-m" type="number" step="any" data-i18n-ph="cvMPh">
        <output id="cv-len">= ft</output></span>
      </label>
      <label><span data-i18n="cvTemp"></span>
        <span class="row"><input id="cv-c" type="number" step="any" data-i18n-ph="cvCPh">
        <output id="cv-temp">= °F</output></span>
      </label>
    </div>

  </div>
</section>

<!-- ============ GLOSSARY ============ -->
<section id="glossary" class="view">
  <h1 data-i18n="glTitle"></h1>
  <div class="gl-controls">
    <input id="gl-search" type="search" data-i18n-ph="glSearchPh">
    <div id="gl-filters" class="seg"></div>
  </div>
  <dl id="gl-list"></dl>
</section>

<!-- ============ QUIZ ============ -->
<section id="quiz" class="view">
  <h1 data-i18n="quizTitle"></h1>
  <div class="card quiz-card">
    <div id="quiz-intro">
      <p data-i18n="quizIntro"></p>
      <button id="quiz-start" class="primary" data-i18n="quizStart"></button>
    </div>
    <div id="quiz-q" hidden>
      <p id="quiz-progress" class="note"></p>
      <h2 id="quiz-question"></h2>
      <div id="quiz-answers"></div>
    </div>
    <div id="quiz-done" hidden>
      <h2 id="quiz-score"></h2>
      <p id="quiz-verdict"></p>
      <button id="quiz-again" class="primary" data-i18n="quizAgain"></button>
    </div>
  </div>
</section>

<footer>
  <p><strong>WORLD CRUISE ACADEMY</strong> <span data-i18n="footerTag"></span></p>
  <p class="note" data-i18n="footerNote"></p>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
