<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Cruise Academy Companion — Tools & Guidance for Cruise Guests and Crew</title>
  <meta name="description" content="Free bilingual cruise companion for guests and crew: guides, cruise lines & ships, itinerary planner, packing checklists, calculators, maritime glossary, quiz and community. English & Bahasa Indonesia. By World Cruise Academy.">
  <meta name="keywords" content="cruise guide, cruise crew, cruise ships, cruise lines, cruise itinerary, cruise tips, cruise packing list, cruise glossary, work on cruise ship, kerja di kapal pesiar, world cruise academy">
  <meta property="og:title" content="World Cruise Academy Companion">
  <meta property="og:description" content="Tools & guidance for cruise guests and crew — guides, ships, itinerary planner, community. EN / ID.">
  <link rel="icon" href="icons/icon48.png">
  <link rel="apple-touch-icon" href="icons/icon128.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0c4a8a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="#home" data-nav="home">
    <img src="icons/icon48.png" alt="" width="30" height="30">
    <span>WORLD CRUISE ACADEMY <em>COMPANION</em></span>
  </a>
  <nav id="nav">
    <a href="#home" data-nav="home" class="nav-home"><span class="ico">🏠</span><span class="lbl" data-i18n="navHome"></span></a>
    <a href="#guest" data-nav="guest"><span class="ico">🧳</span><span class="lbl" data-i18n="navGuest"></span></a>
    <a href="#crew" data-nav="crew"><span class="ico">⚓</span><span class="lbl" data-i18n="navCrew"></span></a>
    <a href="#ships" data-nav="ships"><span class="ico">🚢</span><span class="lbl" data-i18n="navShips"></span></a>
    <a href="#tools" data-nav="tools"><span class="ico">🛠</span><span class="lbl" data-i18n="navTools"></span></a>
    <a href="#academy" data-nav="academy"><span class="ico">🎓</span><span class="lbl" data-i18n="navAcademy"></span></a>
    <a href="#community" data-nav="community"><span class="ico">🤝</span><span class="lbl" data-i18n="navCommunity"></span></a>
  </nav>
  <select id="lang-select" title="Language / Bahasa">
    <option value="en">🌐 EN</option>
    <option value="id">🌐 ID</option>
  </select>
</header>

<!-- ============ HOME ============ -->
<section id="home" class="view">
  <div class="hero">
    <h1 data-i18n="heroTitle"></h1>
    <p data-i18n-html="heroSub"></p>
    <div class="hero-cards">
      <a class="hero-card" href="#guest" data-nav="guest">
        <span class="big">🧳</span>
        <h2 data-i18n="guestCardTitle"></h2>
        <p data-i18n="guestCardDesc"></p>
      </a>
      <a class="hero-card" href="#crew" data-nav="crew">
        <span class="big">⚓</span>
        <h2 data-i18n="crewCardTitle"></h2>
        <p data-i18n="crewCardDesc"></p>
      </a>
    </div>
    <div class="hero-tools">
      <a href="#ships" data-nav="ships" data-i18n="chipShips"></a>
      <a href="#ships" data-nav="ships" data-i18n="chipItin"></a>
      <a href="#tools" data-nav="tools" data-i18n="chipCountdown"></a>
      <a href="#tools" data-nav="tools" data-i18n="chipChecklists"></a>
      <a href="#academy" data-nav="academy" data-i18n="chipGlossary"></a>
      <a href="#academy" data-nav="academy" data-i18n="chipQuiz"></a>
      <a href="#community" data-nav="community" data-i18n="chipCommunity"></a>
    </div>
  </div>
</section>

<!-- ============ GUEST GUIDE ============ -->
<section id="guest" class="view">
  <h1 data-i18n="guestTitle"></h1>
  <p class="lead" data-i18n="guestLead"></p>
  <div id="guest-guide" class="accordion"></div>
</section>

<!-- ============ CREW GUIDE ============ -->
<section id="crew" class="view">
  <h1 data-i18n="crewTitle"></h1>
  <p class="lead" data-i18n="crewLead"></p>
  <div id="crew-guide" class="accordion"></div>
</section>

<!-- ============ SHIPS & ITINERARY ============ -->
<section id="ships" class="view">
  <h1 data-i18n="shipsTitle"></h1>
  <p class="lead" data-i18n="shipsLead"></p>

  <h2 class="sub" data-i18n="linesTitle"></h2>
  <div id="lines-grid"></div>

  <h2 class="sub" data-i18n="fleetTitle"></h2>
  <input id="ship-search" type="search" data-i18n-ph="shipSearchPh">
  <div class="table-wrap card">
    <table id="ships-table">
      <thead><tr>
        <th data-i18n="thShip"></th><th data-i18n="thLine"></th><th data-i18n="thYear"></th>
        <th data-i18n="thGT"></th><th data-i18n="thGuests"></th><th data-i18n="thRegion"></th>
      </tr></thead>
      <tbody id="ships-body"></tbody>
    </table>
  </div>
  <p class="note" data-i18n="shipsNote"></p>

  <div class="card itin-card">
    <h2 data-i18n="itinTitle"></h2>
    <p class="lead" data-i18n="itinLead"></p>
    <div class="itin-form">
      <label><span data-i18n="itPort"></span><input id="it-port" type="text" data-i18n-ph="itPortPh" maxlength="60"></label>
      <label><span data-i18n="itDate"></span><input id="it-date" type="date"></label>
      <label><span data-i18n="itArr"></span><input id="it-arr" type="time"></label>
      <label><span data-i18n="itDep"></span><input id="it-dep" type="time"></label>
      <label class="wide"><span data-i18n="itNotes"></span><input id="it-notes" type="text" data-i18n-ph="itNotesPh" maxlength="120"></label>
      <button id="it-add" class="primary" data-i18n="itAdd"></button>
    </div>
    <ol id="itin-list"></ol>
    <p id="itin-empty" class="note" data-i18n="itEmpty"></p>
  </div>
</section>

<!-- ============ TOOLS ============ -->
<section id="tools" class="view">
  <h1 data-i18n="toolsTitle"></h1>

  <div class="tool-grid">

    <div class="tool card">
      <h2 data-i18n="cdTitle"></h2>
      <div id="cd-setup">
        <label><span data-i18n="cdWhat"></span>
          <input id="cd-name" type="text" data-i18n-ph="cdPlaceholder" maxlength="60">
        </label>
        <label><span data-i18n="cdDate"></span> <input id="cd-date" type="date"></label>
        <button id="cd-save" class="primary" data-i18n="cdStart"></button>
      </div>
      <div id="cd-display" hidden>
        <p id="cd-cruise-name"></p>
        <div id="cd-days">–</div>
        <p id="cd-label"></p>
        <button id="cd-reset" class="ghost" data-i18n="cdChange"></button>
      </div>
    </div>

    <div class="tool card">
      <h2 data-i18n="clTitle"></h2>
      <div class="seg">
        <button class="seg-btn active" data-list="guest" data-i18n="clGuest"></button>
        <button class="seg-btn" data-list="crew" data-i18n="clCrew"></button>
      </div>
      <p class="progress"><span id="cl-done">0</span>/<span id="cl-total">0</span> <span data-i18n="clPacked"></span></p>
      <div id="cl-groups"></div>
    </div>

    <div class="tool card">
      <h2 data-i18n="tipTitle"></h2>
      <label><span data-i18n="tipGuests"></span> <input id="tip-guests" type="number" min="1" value="2"></label>
      <label><span data-i18n="tipNights"></span> <input id="tip-nights" type="number" min="1" value="7"></label>
      <label><span data-i18n="tipRate"></span>
        <input id="tip-rate" type="number" min="0" step="0.5" value="16">
      </label>
      <div class="result"><span data-i18n="tipService"></span> <strong id="tip-total">$224.00</strong></div>
      <label><span data-i18n="tipBarBill"></span> <input id="bar-bill" type="number" min="0" value="0"></label>
      <label><span data-i18n="tipBarPct"></span> <input id="bar-pct" type="number" min="0" max="30" value="18"></label>
      <div class="result"><span data-i18n="tipBar"></span> <strong id="bar-total">$0.00</strong></div>
      <p class="note" data-i18n="tipNote"></p>
    </div>

    <div class="tool card">
      <h2 data-i18n="cvTitle"></h2>
      <label><span data-i18n="cvSpeed"></span>
        <span class="row"><input id="cv-knots" type="number" step="any" data-i18n-ph="cvKnotsPh">
        <output id="cv-speed">= km/h · mph</output></span>
      </label>
      <label><span data-i18n="cvDist"></span>
        <span class="row"><input id="cv-nm" type="number" step="any" data-i18n-ph="cvNmPh">
        <output id="cv-dist">= km · mi</output></span>
      </label>
      <label><span data-i18n="cvDepth"></span>
        <span class="row"><input id="cv-m" type="number" step="any" data-i18n-ph="cvMPh">
        <output id="cv-len">= ft</output></span>
      </label>
      <label><span data-i18n="cvTemp"></span>
        <span class="row"><input id="cv-c" type="number" step="any" data-i18n-ph="cvCPh">
        <output id="cv-temp">= °F</output></span>
      </label>
    </div>

  </div>
</section>

<!-- ============ ACADEMY (Glossary + Quiz) ============ -->
<section id="academy" class="view">
  <h1 data-i18n="academyTitle"></h1>
  <div class="seg academy-seg">
    <button class="seg-btn active" data-ac="glossary" data-i18n="acGlossary"></button>
    <button class="seg-btn" data-ac="quiz" data-i18n="acQuiz"></button>
  </div>

  <div id="academy-glossary">
    <div class="gl-controls">
      <input id="gl-search" type="search" data-i18n-ph="glSearchPh">
      <div id="gl-filters" class="seg"></div>
    </div>
    <dl id="gl-list"></dl>
  </div>

  <div id="academy-quiz" hidden>
    <div class="card quiz-card">
      <div id="quiz-intro">
        <p data-i18n="quizIntro"></p>
        <button id="quiz-start" class="primary" data-i18n="quizStart"></button>
      </div>
      <div id="quiz-q" hidden>
        <p id="quiz-progress" class="note"></p>
        <h2 id="quiz-question"></h2>
        <div id="quiz-answers"></div>
      </div>
      <div id="quiz-done" hidden>
        <h2 id="quiz-score"></h2>
        <p id="quiz-verdict"></p>
        <button id="quiz-again" class="primary" data-i18n="quizAgain"></button>
      </div>
    </div>
  </div>
</section>

<!-- ============ COMMUNITY ============ -->
<section id="community" class="view">
  <h1 data-i18n="communityTitle"></h1>
  <p class="lead" data-i18n="communityLead"></p>

  <h2 class="sub" data-i18n="joinTitle"></h2>
  <div class="join-grid">
    <!-- TODO: replace href="#" with your real group invite links -->
    <a class="join-card" href="#" data-join="wa">
      <span class="j-ico">💬</span>
      <strong data-i18n="joinWhatsApp"></strong>
      <p data-i18n="joinWhatsAppDesc"></p>
      <span class="j-soon" data-i18n="joinSoon"></span>
    </a>
    <a class="join-card" href="#" data-join="tg">
      <span class="j-ico">📣</span>
      <strong data-i18n="joinTelegram"></strong>
      <p data-i18n="joinTelegramDesc"></p>
      <span class="j-soon" data-i18n="joinSoon"></span>
    </a>
    <a class="join-card" href="#" data-join="fb">
      <span class="j-ico">👥</span>
      <strong data-i18n="joinFacebook"></strong>
      <p data-i18n="joinFacebookDesc"></p>
      <span class="j-soon" data-i18n="joinSoon"></span>
    </a>
  </div>

  <h2 class="sub" data-i18n="storiesTitle"></h2>
  <div id="stories-grid"></div>

  <div class="card share-card">
    <h2 data-i18n="shareTitle"></h2>
    <p data-i18n="shareDesc"></p>
    <!-- TODO: change to your real contact email -->
    <a class="btn-link" href="mailto:hello@worldcruiseacademy.com?subject=My%20cruise%20story" data-i18n="shareBtn"></a>
  </div>
</section>

<footer>
  <p><strong>WORLD CRUISE ACADEMY</strong> <span data-i18n="footerTag"></span></p>
  <p class="note" data-i18n="footerNote"></p>
</footer>

<script src="data.js"></script>
<script src="extra.js"></script>
<script src="app.js"></script>
</body>
</html>
