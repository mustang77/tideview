      --img-reveal: var(--img-base);
      --img-thumb: var(--img-base);
      --img-ratio: 0.5627;
      --img-zoom: 1;      /* 1 = fit screen height; raised on very wide screens */
      /* fade applied to the picture's left edge so it melts into the backdrop */
      --edge-fade: linear-gradient(90deg, transparent 0%, #000 55%);

      --cream: #FBDBAF;
      --muted: rgba(251, 219, 175, 0.72);
      --label: rgba(251, 219, 175, 0.48);
      --orange: #E07020;
      --card: rgba(10, 8, 7, 0.58);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #0a1220;
      color: var(--cream);
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1, h2, h3, .heading-font {
      font-family: 'Orbitron-Medium', 'Arial Narrow', sans-serif;
      font-weight: 400;
      letter-spacing: 0.02em;
      margin: 0;
    }

    p { margin: 0; }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* ===================== HERO ===================== */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      /* Clean backdrop behind the text on wide screens: dusk sky fading to deep sea */
      background:
        radial-gradient(60% 80% at 100% 45%, rgba(224, 112, 32, 0.22) 0%, rgba(224, 112, 32, 0) 70%),
        linear-gradient(180deg, #2b1a2a 0%, #16182b 45%, #0a1220 100%);
    }

    /* Sharp picture fitted to the screen height and parked on the right,
       so it is never upscaled and blurred on wide monitors */
    .hero-base-img,
    .hero-reveal-img {
      background-size: auto calc(100% * var(--img-zoom));
      background-position: right 38%;
      background-repeat: no-repeat;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
    }

    .hero-base-img {
      position: absolute;
      inset: 0;
      z-index: 1;
      background-image: var(--img-base);
      -webkit-mask-image: var(--edge-fade);
      mask-image: var(--edge-fade);
      -webkit-mask-size: calc(100vh * var(--img-ratio) * var(--img-zoom)) 100%;
      mask-size: calc(100vh * var(--img-ratio) * var(--img-zoom)) 100%;
      -webkit-mask-position: right center;
      mask-position: right center;
    }

    .hero-reveal-img {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background-image: var(--img-reveal);
      /* With a single picture, this filter turns the spotlight area into a cool
         electric "night mode" so the reveal is clearly different from the base.
         If --img-reveal points at a genuinely different picture, set filter: none. */
      filter: sepia(1) hue-rotate(160deg) saturate(2.4) contrast(1.2) brightness(1.1);
      /* layer 1: cursor spotlight (set by JS); layer 2: same edge fade as the base */
      -webkit-mask-image: radial-gradient(circle 0px at -999px -999px, #fff, transparent), var(--edge-fade);
      mask-image: radial-gradient(circle 0px at -999px -999px, #fff, transparent), var(--edge-fade);
      -webkit-mask-size: 100% 100%, calc(100vh * var(--img-ratio) * var(--img-zoom)) 100%;
      mask-size: 100% 100%, calc(100vh * var(--img-ratio) * var(--img-zoom)) 100%;
      -webkit-mask-position: 0 0, right center;
      mask-position: 0 0, right center;
      -webkit-mask-composite: source-in;
      mask-composite: intersect;
    }

    /* Ultra-wide monitors (21:9 and wider): let the picture grow a little so it
       is not a thin strip, at a mild upscale that stays sharp */
    @media (min-aspect-ratio: 2/1) {
      :root { --img-zoom: 1.34; }
    }

    /* Soft dark gradient so the text stays readable over the bright image */
    .hero-scrim {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(10, 8, 7, 0.45) 0%, rgba(10, 8, 7, 0.2) 34%, rgba(10, 8, 7, 0) 60%),
        linear-gradient(0deg, rgba(10, 8, 7, 0.55) 0%, rgba(10, 8, 7, 0.15) 28%, rgba(10, 8, 7, 0) 48%);
    }

    .hero-ui {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto 1fr auto;
      padding: 36px 44px 40px;
      pointer-events: none;
    }

    /* ===================== LEFT COLUMN ===================== */
    .hero-left {
      grid-column: 1;
      grid-row: 1 / -1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-start;
      gap: 28px;
      min-width: 0;
    }

    .hero-copy {
      max-width: 520px;
      padding-right: 56px;
      pointer-events: auto;
    }

    .hero-copy h1 {
      font-size: clamp(1.55rem, 3.6vw, 3.15rem);
      line-height: 1.05;
      text-transform: uppercase;
      color: var(--cream);
      text-shadow: 0 2px 28px rgba(0, 0, 0, 0.22);
    }

    .hero-copy h1 > span,
    .pull-line {
      display: block;
    }

    /* ===================== ANIMATIONS ===================== */
    @keyframes heroImageIn {
      from { opacity: 0; transform: scale(1.18); }
      to   { opacity: 1; transform: scale(1); }
    }

    .hero-image-animate {
      opacity: 0;
      animation: heroImageIn 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      animation-delay: 0.15s;
    }

    @keyframes wordPullUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .pull-word {
      display: inline-block;
      opacity: 0;
      transform: translateY(20px);
    }

    .pull-word:not(:last-child) {
      margin-right: 0.3em;
    }

    .words-visible .pull-word {
      animation: wordPullUp 0.55s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); filter: blur(8px); }
      to   { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    .fade-up-reveal {
      opacity: 0;
      transform: translateY(14px);
      filter: blur(8px);
    }

    .fade-up-reveal.is-visible {
      animation: fadeUp 0.7s ease forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-image-animate,
      .pull-word,
      .words-visible .pull-word,
      .fade-up-reveal,
      .fade-up-reveal.is-visible {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }
    }

    /* ===================== RESPONSIVE ===================== */
    @media (max-width: 1024px) {
      .hero-ui { padding: 32px 28px 36px; }
    }

    @media (max-width: 900px) {
      .hero-ui { padding: 28px 22px 28px; }
      .hero-copy h1 { font-size: clamp(1.35rem, 7.2vw, 2.4rem); }
      :root { --edge-fade: linear-gradient(#000, #000); }
      .hero-base-img,
      .hero-reveal-img {
        background-size: cover;
        background-position: 40% center;
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
      }
      .hero-reveal-img {
        -webkit-mask-size: 100% 100%, 100% 100%;
        mask-size: 100% 100%, 100% 100%;
      }
    }

    @media (max-width: 768px) {
      .hero-ui {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
        padding: max(24px, env(safe-area-inset-top))
                 max(20px, env(safe-area-inset-right))
                 max(28px, env(safe-area-inset-bottom))
                 max(20px, env(safe-area-inset-left));
      }
      .hero-left {
        grid-column: 1;
        grid-row: 1 / 3;
        gap: 24px;
      }
      .hero-base-img,
      .hero-reveal-img { background-position: 40% center; }
    }

    @media (max-width: 720px) {
      .hero {
        height: auto;
        min-height: 100vh;
        min-height: 100dvh;
      }
      .hero-ui {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        justify-content: flex-start;
        gap: 28px;
        padding: max(22px, env(safe-area-inset-top))
                 max(18px, env(safe-area-inset-right))
                 max(24px, env(safe-area-inset-bottom))
                 max(18px, env(safe-area-inset-left));
      }
      .hero-left {
        grid-column: unset;
        grid-row: unset;
        width: 100%;
        justify-content: flex-start;
      }
      .hero-copy {
        max-width: 100%;
        padding-right: 48px;
      }
      .hero-base-img,
      .hero-reveal-img {
        position: absolute;
        background-position: 40% center;
      }
    }

    @media (max-width: 480px) {
      .hero-ui {
        gap: 22px;
        padding: max(18px, env(safe-area-inset-top))
                 max(16px, env(safe-area-inset-right))
                 max(20px, env(safe-area-inset-bottom))
                 max(16px, env(safe-area-inset-left));
      }
      .hero-copy h1 { font-size: clamp(1.1rem, 8.5vw, 1.65rem); }
      .hero-left { gap: 22px; }
    }

    @media (max-width: 360px) {
      .hero-copy h1 { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="hero-base-img hero-image-animate"></div>

    <div class="hero-reveal-img" id="reveal-img"></div>

    <div class="hero-scrim" aria-hidden="true"></div>

    <div class="hero-ui">
      <div class="hero-left">
        <div class="hero-copy">
          <h1 class="words-pull-up">
            <span>WORLD</span>
            <span>CRUISE</span>
            <span>ACADEMY</span>
          </h1>
        </div>

      </div>

    </div>
  </main>

  <script>
    (function () {
      'use strict';

      /* ---------- 1. SPOTLIGHT REVEAL ---------- */
      var revealImg = document.getElementById('reveal-img');

      function spotlightRadius() {
        var w = window.innerWidth;
        if (w < 480) return 120;
        if (w < 720) return 160;
        return 260;
      }

      function setSpotlight(clientX, clientY) {
        if (!revealImg) return;
        var rect = revealImg.getBoundingClientRect();
        var x = clientX - rect.left;
        var y = clientY - rect.top;
        var r = spotlightRadius();
        var mask = 'radial-gradient(circle ' + r + 'px at ' + x + 'px ' + y + 'px, ' +
          '#fff 0%, #fff 40%, rgba(255,255,255,0.75) 60%, rgba(255,255,255,0.4) 75%, ' +
          'rgba(255,255,255,0.12) 88%, transparent 100%)';
        var edge = getComputedStyle(revealImg).getPropertyValue('--edge-fade').trim() || 'linear-gradient(#000, #000)';
        revealImg.style.webkitMaskImage = mask + ', ' + edge;
        revealImg.style.maskImage = mask + ', ' + edge;
      }

      window.addEventListener('mousemove', function (e) {
        setSpotlight(e.clientX, e.clientY);
      });

      window.addEventListener('touchmove', function (e) {
        if (e.touches && e.touches.length) {
          setSpotlight(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      /* ---------- 2. WORD SPLIT ---------- */
      function wrapWords(text, startIndex) {
        var frag = document.createDocumentFragment();
        var words = text.trim().split(/\s+/).filter(Boolean);
        var idx = startIndex;
        words.forEach(function (word) {
          var span = document.createElement('span');
          span.className = 'pull-word';
          span.textContent = word;
          span.style.animationDelay = (idx * 0.1) + 's';
          frag.appendChild(span);
          idx++;
        });
        return { fragment: frag, nextIndex: idx };
      }

      function splitWords(el) {
        if (el.dataset.split === 'true') return;
        el.dataset.split = 'true';

        var directSpans = Array.prototype.filter.call(el.children, function (child) {
          return child.tagName === 'SPAN';
        });

        if (el.tagName === 'H1' && directSpans.length) {
          var wordIndex = 0;
          directSpans.forEach(function (line) {
            line.classList.add('pull-line');
            line.style.display = 'block';
            var result = wrapWords(line.textContent, wordIndex);
            line.textContent = '';
            line.appendChild(result.fragment);
            wordIndex = result.nextIndex;
          });
        } else {
          var res = wrapWords(el.textContent, 0);
          el.textContent = '';
          el.appendChild(res.fragment);
        }
      }

      var wordEls = Array.prototype.slice.call(document.querySelectorAll('.words-pull-up'));
      var fadeEls = Array.prototype.slice.call(document.querySelectorAll('.fade-up-reveal'));

      wordEls.forEach(splitWords);

      /* ---------- 3. SCROLL REVEAL ---------- */
      function revealFade(el) {
        var delay = el.getAttribute('data-delay');
        if (delay) el.style.animationDelay = delay + 's';
        el.classList.add('is-visible');
      }

      if ('IntersectionObserver' in window) {
        var wordObserver = new IntersectionObserver(function (entries, obs) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('words-visible');
              obs.unobserve(entry.target);
            }
          });
        }, { threshold: 0.2 });

        var fadeObserver = new IntersectionObserver(function (entries, obs) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              revealFade(entry.target);
              obs.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15 });

        wordEls.forEach(function (el) { wordObserver.observe(el); });
        fadeEls.forEach(function (el) { fadeObserver.observe(el); });
      } else {
        wordEls.forEach(function (el) { el.classList.add('words-visible'); });
        fadeEls.forEach(revealFade);
      }
    })();
  </script>
</body>
</html>
