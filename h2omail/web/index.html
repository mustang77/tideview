<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="WCA Mail - webmail">
  <title>WCA Mail</title>

  <!-- iOS: Add to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WCA Mail">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0b1622; }
  </style>

  <!-- One deploy serves three hostnames; brand the tab, PWA name and icons
       per hostname by swapping the title, apple-touch-icon and manifest. -->
  <script>
    (function () {
      var h = location.hostname;
      var brand =
          h.indexOf('mayaresortsubud') >= 0 ? {
            name: 'Maya Resort Mail', theme: '#00897B', bg: '#ffffff',
            p192: 'icons/maya-192.png', p512: 'icons/maya-512.png',
            touch: 'icons/maya-180.png'
          } :
          h.indexOf('worldcruiseacademy') >= 0 ? {
            name: 'WCA Mail', theme: '#0d2149', bg: '#ffffff',
            p192: 'icons/wca-192.png', p512: 'icons/wca-512.png',
            touch: 'icons/wca-180.png'
          } :
          h.indexOf('h2olaundry') >= 0 ? {
            name: 'H2O Mail', theme: '#0288D1', bg: '#0b1622',
            p192: 'icons/icon-192.png', p512: 'icons/icon-512.png',
            touch: 'icons/apple-touch-icon.png'
          } : {
            name: 'Mail', theme: '#0288D1', bg: '#0b1622',
            p192: 'icons/icon-192.png', p512: 'icons/icon-512.png',
            touch: 'icons/apple-touch-icon.png'
          };

      document.title = brand.name;

      var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (appleTitle) appleTitle.setAttribute('content', brand.name);

      var appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
      if (appleIcon) appleIcon.setAttribute('href', brand.touch);

      var theme = document.querySelector('meta[name="theme-color"]');
      if (!theme) {
        theme = document.createElement('meta');
        theme.setAttribute('name', 'theme-color');
        document.head.appendChild(theme);
      }
      theme.setAttribute('content', brand.theme);

      // Manifest is served as a blob: URL, so every URL inside must be
      // absolute (relative paths would resolve against the blob, not the site).
      var base = location.origin + location.pathname.replace(/[^/]*$/, '');
      var manifest = {
        name: brand.name,
        short_name: brand.name,
        start_url: base,
        scope: base,
        display: 'standalone',
        background_color: brand.bg,
        theme_color: brand.theme,
        icons: [
          { src: base + brand.p192, sizes: '192x192', type: 'image/png', purpose: 'any' },
          { src: base + brand.p512, sizes: '512x512', type: 'image/png', purpose: 'any' },
          { src: base + brand.p512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
        ]
      };
      var link = document.querySelector('link[rel="manifest"]');
      if (link) {
        var blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        link.setAttribute('href', URL.createObjectURL(blob));
      }
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
