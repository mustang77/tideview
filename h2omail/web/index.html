<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="WCA Mail - webmail">
  <title>WCA Mail</title>

  <!-- iOS: Add to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WCA Mail">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0b1622; }
  </style>

  <!-- One deploy serves three hostnames; name the tab/PWA per brand. -->
  <script>
    (function () {
      var h = location.hostname;
      var t = h.indexOf('mayaresortsubud') >= 0 ? 'Maya Resort Mail'
            : h.indexOf('worldcruiseacademy') >= 0 ? 'WCA Mail'
            : h.indexOf('h2olaundry') >= 0 ? 'H2O Mail'
            : 'Mail';
      document.title = t;
      var m = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (m) m.setAttribute('content', t);
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
